<!-- @dsCard height=288 -->
<style>
  html, body { margin: 0; background: var(--canvas); }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--canvas); font-family: var(--font-ui); }
  .cover svg { position: absolute; inset: 0; }
  .ink { fill: var(--text); }
  .accent { fill: var(--brand-accent); }
  .agent { fill: var(--role-agent); }
  .source { fill: var(--role-source); }
  .orange { fill: var(--brand-orange); }
  .tint { fill: var(--surface-subtle); }
  .arc { fill: none; stroke: var(--on-action); stroke-width: 10; stroke-linecap: round; }
  .dot { fill: var(--on-action); }
  .name { position: absolute; left: 40px; bottom: 36px; width: 440px; }
  .name h1 { margin: 0; font-size: 72px; line-height: .95; font-weight: 700; letter-spacing: -0.02em; color: var(--text); }
  .name p { margin: 12px 0 0; font-size: 13px; line-height: 1.4; color: var(--text-secondary); }
</style>
<div class="cover">
  <svg viewBox="0 0 960 288" width="960" height="288" aria-hidden="true">
    <!-- blocks: accent 200x176 slab (radius-panel), ink 224x120 bleeding top-right, role-agent 112x152 bleeding bottom, brand-orange 96x96, role-source 96x40, surface-subtle 200x96 tint -->
    <!-- arrangement: one tall slab with satellites, all right of x=480, gaps of space-4 (16px) -->
    <!-- pattern: a literal motif, the ARC mark's double arc loop between two endpoint dots, drawn in on-action over the accent slab, because ARC is the loop between remote sources and local agents -->
    <!-- scales: space-4 gaps, radius-panel (20) on the slab, radius-row (12) on satellites, arc stroke 10 -->
    <rect class="accent" x="520" y="0" width="200" height="176" rx="20" />
    <rect class="tint" x="520" y="192" width="200" height="96" rx="12" />
    <rect class="ink" x="736" y="-20" width="244" height="140" rx="12" />
    <rect class="agent" x="736" y="136" width="112" height="172" rx="12" />
    <rect class="orange" x="864" y="136" width="96" height="96" rx="12" />
    <rect class="source" x="864" y="248" width="96" height="40" rx="12" />
    <path class="arc" d="M570 108 A50 50 0 0 1 670 108" />
    <path class="arc" d="M570 108 A50 50 0 0 0 670 108" />
    <circle class="dot" cx="570" cy="108" r="11" />
    <circle class="dot" cx="670" cy="108" r="11" />
  </svg>
  <div class="name">
    <h1>ARC Design<br>System</h1>
    <p>The real components of Agent Remote Control, mounted in design.</p>
  </div>
</div>
