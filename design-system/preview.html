<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARC design components · React 18 host</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./dist/tokens.css">
  <link rel="stylesheet" href="./dist/arc.css">
  <style>
    body { margin: 24px; font: 14px/1.5 system-ui; background: #dedee3; }
    .preview-boards { display: grid; grid-template-columns: repeat(2, minmax(360px, 1fr)); gap: 24px; max-width: 1100px; }
    .preview-boards > .arc-root { background: var(--canvas); color: var(--text); padding: 24px; border-radius: 16px; }
    .preview-sample { margin: 0 0 20px; }
    .preview-sample > h3 { margin: 0 0 8px; font-size: 12px; font-weight: 500; }
    .preview-state { margin: 16px 0; }
    @media (max-width: 800px) { .preview-boards { grid-template-columns: minmax(300px, 1fr); } }
  </style>
  <!-- The canvas already supplies these. CDN React files are for this preview only. -->
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.development.js"></script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="./dist/arc.js"></script>
</head>
<body>
  <h1>ARC components</h1>
  <p id="host-sentinel">React 18 host markup</p>
  <div id="preview"></div>
  <script>
    const h = React.createElement, f = Arc.fixtures;
    const noop = () => {}, refresh = async () => {};
    window.previewActions = [];
    document.addEventListener('arc:action', event => window.previewActions.push(event.detail));
    function Board({ mode, locale, privacy, now }) {
      const [checked, setChecked] = React.useState(true);
      const [choice, setChoice] = React.useState('claude');
      const [revealed, setRevealed] = React.useState(false);
      const [copied, setCopied] = React.useState(false);
      const sample = (name, props = {}, children, label = name) => h('section', { className: 'preview-sample', key: label },
        h('h3', null, label), h(Arc[name], props, children));
      return h(Arc.Root, { mode, locale, privacy, now },
        h('h2', null, mode),
        sample('Button', { variant: 'primary', onClick: () => window.previewActions.push({ kind: 'button' }) }, f.labels.button),
        sample('IconButton', { icon: 'RefreshCw', label: 'Refresh fixture', onClick: noop }),
        sample('Switch', { label: 'Enable fixture', checked, onChange: setChecked }),
        sample('SingleChoice', { label: 'Agent', value: choice, onChange: setChoice, options: f.choices }),
        sample('Notice', { tone: 'warning' }, f.accounts[0].email),
        sample('Empty', {}, f.labels.empty),
        sample('Loading'),
        sample('Status', { tone: 'success' }, f.labels.status),
        sample('Tag', { tone: 'source' }, f.labels.tag),
        sample('AgentQuotaIcon', { agent: 'claude', dual: true, quota: f.accounts[0].quota }),
        sample('AgentQuota', { provider: f.quotaSnapshots[0], onRefresh: noop, refreshing: false }),
        sample('QuotaBubble', { provider: f.quotaSnapshots[0], onRefresh: refresh }),
        sample('GraphNode', { label: f.sources[0].label, state: 'normal', onOpen: noop, onMove: noop }, 'C'),
        ...['compact', 'standard', 'detailed'].map(density => sample('ActivityBubble', {
          agent: f.activitySessions[0].agent, session: f.activitySessions[0], density, onRead: noop,
        }, undefined, `ActivityBubble · ${density}`)),
        ...['source', 'agent', 'provider'].map(role => sample('PlatformIcon', {
          platform: role === 'source' ? f.sources[0].product : 'claude', role, size: 24,
        }, undefined, `PlatformIcon · ${role}`)),
        sample('PlatformIcon', { platform: 'unknown', role: 'provider', fallback: 'Info', size: 24 }, undefined, 'PlatformIcon · fallback'),
        sample('PlatformIcon', { platform: 'codex', role: 'agent', add: true, size: 24 }, undefined, 'PlatformIcon · add'),
        ...['badge', 'dot', 'compact', 'text'].map(variant => sample('StateBadge', {
          presentation: { tone: 'success', labelKey: 'connected', icon: 'Check' }, label: 'Connected', variant,
        }, undefined, `StateBadge · ${variant}`)),
        sample('SectionHeader', { title: 'Providers', level: 2, count: 2, leading: 'P', secondary: 'Quota', actions: 'Refresh' }),
        sample('EntityRow', { title: 'Claude', secondary: 'Provider', leading: 'C', state: 'Ready', actions: 'Open', selected: true, chevron: true,
          onClick: () => window.previewActions.push({ kind: 'entity-row' }) }),
        sample('EntityCard', { icon: 'C', title: 'Claude', headerActions: 'Refresh', footer: 'Observed now', danger: 'Unavailable' }, 'Provider details'),
        sample('FactList', { items: [{ label: 'Agent', value: 'Claude' }, { label: 'Plan' }], missing: { placeholder: 'Unknown' } }),
        sample('Freshness', { observedAt: new Date(f.now).toISOString(), age: 'Just now', stale: true, timestampLabel: new Date(f.now).toISOString(),
          refreshLabel: 'Refresh observation', onRefresh: () => window.previewActions.push({ kind: 'freshness' }) }),
        sample('AddressField', { label: 'Fixture address', value: 'https://example.com', display: revealed ? 'https://example.com' : '••••',
          revealed, onReveal: () => setRevealed(value => !value), copied,
          onCopy: value => { setCopied(true); window.previewActions.push({ kind: 'address-copy', value }); } }),
        h('details', null, h('summary', null, 'Quota and activity states'),
          sample('AgentQuotaIcon', { agent: 'claude', quota: null }, undefined, 'AgentQuotaIcon · missing quota'),
          ...Object.entries(f.quotaStates).map(([state, provider]) => h('section', { className: 'preview-state', key: state },
            h('h3', null, state), h(Arc.QuotaBubble, { provider, onRefresh: refresh }))),
          ...f.activitySessions.slice(1, 3).map(session => sample('ActivityBubble', {
            agent: session.agent, session, density: 'detailed', onRead: noop,
          }, undefined, session.title))));
    }
    function Preview() {
      const [overrides, setOverrides] = React.useState({});
      window.updatePreview = setOverrides;
      return h('main', { className: 'preview-boards' },
        h(Board, { mode: 'light', locale: 'en', privacy: false, now: f.now, ...overrides }),
        h(Board, { mode: 'dark', locale: 'zh-CN', privacy: true, now: f.now }));
    }
    window.previewRoot = ReactDOM.createRoot(document.getElementById('preview'));
    window.previewRoot.render(h(React.StrictMode, null, h(Preview)));
  </script>
</body>
</html>
