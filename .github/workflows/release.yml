name: Release
run-name: Release ${{ inputs.tag }} (macOS)
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        type: string
        required: true
permissions:
  contents: write
concurrency:
  group: connector-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: astral-sh/setup-uv@v6
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: desktop-aarch64-apple-darwin
          key: shared-target-v2
          workspaces: |
            desktop -> ../target
          cache-bin: false
          save-if: 'true'
      - run: npm ci
      - name: Build signed macOS installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run desktop:build -- --release --target aarch64-apple-darwin
      - name: Generate metadata and verify signature
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run release:stage -- darwin-aarch64 target/aarch64-apple-darwin/release/bundle release-artifacts
          npm run release:finalize -- release-artifacts
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          gh release create "$RELEASE_TAG"
          release-artifacts/*.dmg release-artifacts/*.gz release-artifacts/*.sig
          release-artifacts/latest.json release-artifacts/SHA256SUMS.txt
          release-artifacts/local-connector.rb release-artifacts/release-notes.md
          --notes-file release-artifacts/release-notes.md --latest
