name: Build release platforms
run-name: Linux ${{ inputs.version }} (${{ inputs.source_sha }})
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact full source commit SHA
        type: string
        required: true
      version:
        description: Build version (x.y.z; no tag required)
        type: string
        required: true
env:
  ARC_BUILD_VERSION: ${{ inputs.version }}
permissions:
  contents: read
concurrency:
  group: connector-release
  cancel-in-progress: false
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            arch: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Verify exact source SHA
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: . -> target
          shared-key: linux-${{ matrix.arch }}
      - name: Check and build headless Core
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo clippy --manifest-path native/Cargo.toml --locked --target "$TARGET"
          cargo build --manifest-path native/Cargo.toml --locked --release --bin arc --target "$TARGET"
      - name: Package Linux tarball
        env:
          RELEASE_TAG: v${{ inputs.version }}
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          test "v$(target/$TARGET/release/arc --version)" = "$RELEASE_TAG"
          mkdir -p linux-package linux-artifacts
          cp "target/$TARGET/release/arc" LICENSE linux-package/
          mkdir -p linux-package/skills
          cp -R skills/arc-setup linux-package/skills/
          cp -R licenses linux-package/
          tar -czf "linux-artifacts/agent-remote-control-$RELEASE_TAG-linux-$ARCH.tar.gz" -C linux-package arc LICENSE skills licenses
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: linux-artifacts/*.tar.gz
          if-no-files-found: error
